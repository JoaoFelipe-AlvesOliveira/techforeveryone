  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n        <p class=\"overline\">Quem somos / 002<\u002Fp>\n        <h2 class=\"h2\" id=\"t-quem\">Somos simplificadores do presente.<\u002Fh2>\n        <p class=\"lead\">A TFE — Tech For Everyone — é uma empresa jovem, inovadora e exclusiva. Ajustamos, consolidamos e criamos processos, trazendo visão crítica para o negócio e gestão da inovação.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"about-grid\" data-reveal=\"1\">\n        <div class=\"about-card\" data-r=\"1\">\n          <p class=\"overline\">Missão<\u002Fp>\n          <h3>Gerar valor e compartilhar conhecimento através da tecnologia.<\u002Fh3>\n        <\u002Fdiv>\n        <div class=\"about-card\" data-r=\"1\">\n          <p class=\"overline\">Visão<\u002Fp>\n          <h3>Simplificar o presente, abrindo espaço para o futuro.<\u002Fh3>\n        <\u002Fdiv>\n        <div class=\"about-card\" data-r=\"1\">\n          <p class=\"overline\">Estratégia<\u002Fp>\n          <h3>Transformar pessoas através das empresas.<\u002Fh3>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"values-block\" data-reveal=\"1\">\n        <div class=\"values-head\" data-r=\"1\">\n          <p class=\"overline\">Nossos valores<\u002Fp>\n          <span>O que guia cada entrega<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"values\">\n          <li class=\"value\" data-r=\"1\"><span class=\"value-n\">01<\u002Fspan><b>Inovação<\u002Fb><p>Buscamos novas formas de resolver problemas com tecnologia.<\u002Fp><\u002Fli>\n          <li class=\"value\" data-r=\"1\"><span class=\"value-n\">02<\u002Fspan><b>Empreendedorismo<\u002Fb><p>Tratamos cada projeto como se fosse o nosso próprio negócio.<\u002Fp><\u002Fli>\n          <li class=\"value\" data-r=\"1\"><span class=\"value-n\">03<\u002Fspan><b>Compartilhamento<\u002Fb><p>Conhecimento cresce quando é dividido com clientes e times.<\u002Fp><\u002Fli>\n          <li class=\"value\" data-r=\"1\"><span class=\"value-n\">04<\u002Fspan><b>Qualidade<\u002Fb><p>Aperfeiçoamento constante em cada detalhe da solução.<\u002Fp><\u002Fli>\n          <li class=\"value\" data-r=\"1\"><span class=\"value-n\">05<\u002Fspan><b>Simplicidade<\u002Fb><p>Soluções claras, fáceis de usar e de manter.<\u002Fp><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COUNTERS -->\n  <section class=\"sec\" aria-label=\"A TFE em números\" style=\"padding-bottom: 0\">\n    <div class=\"wrap\">\n      <div class=\"stats\" data-reveal=\"1\">\n        <div class=\"stat\" data-r=\"1\"><span class=\"stat-v\" aria-label=\"4\"><span data-count=\"4\" aria-hidden=\"true\">4<\u002Fspan><\u002Fspan><span class=\"stat-l\">frentes de especialização<\u002Fspan><\u002Fdiv>\n        <div class=\"stat\" data-r=\"1\"><span class=\"stat-v\" aria-label=\"3\"><span data-count=\"3\" aria-hidden=\"true\">3<\u002Fspan><\u002Fspan><span class=\"stat-l\">etapas de entrega<\u002Fspan><\u002Fdiv>\n        <div class=\"stat\" data-r=\"1\"><span class=\"stat-v\" aria-label=\"Mais de 9\"><span aria-hidden=\"true\">+<\u002Fspan><span data-count=\"9\" aria-hidden=\"true\">9<\u002Fspan><\u002Fspan><span class=\"stat-l\">anos no mercado<\u002Fspan><\u002Fdiv>\n        <div class=\"stat\" data-r=\"1\"><span class=\"stat-v\" aria-label=\"100%\"><span data-count=\"100\" aria-hidden=\"true\">100<\u002Fspan><span aria-hidden=\"true\">%<\u002Fspan><\u002Fspan><span class=\"stat-l\">projetos sob medida<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROCESS -->\n  <section class=\"sec\" id=\"como-funciona\" aria-labelledby=\"t-processo\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\" data-head=\"1\">\n        <p class=\"overline\">Como funciona / 003<\u002Fp>\n        <h2 class=\"h2\" id=\"t-processo\">Do primeiro contato ao resultado, em três etapas.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"steps\" data-reveal=\"1\">\n        <div class=\"step\" data-r=\"1\">\n          <span class=\"step-n\">01<\u002Fspan>\n          <h3>Diagnóstico com visão crítica<\u002Fh3>\n          <p>Entendemos seus processos, sistemas e metas e trazemos uma visão crítica sobre onde a tecnologia gera mais valor.<\u002Fp>\n          <div class=\"step-line\" data-line=\"1\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"step\" data-r=\"1\">\n          <span class=\"step-n\">02<\u002Fspan>\n          <h3>Ajustar, consolidar e criar<\u002Fh3>\n          <p>Redesenhamos os processos, construímos a solução e validamos com quem vai usar no dia a dia.<\u002Fp>\n          <div class=\"step-line\" data-line=\"1\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"step\" data-r=\"1\">\n          <span class=\"step-n\">03<\u002Fspan>\n          <h3>Entrega e gestão da inovação<\u002Fh3>\n          <p>Colocamos em produção, compartilhamos o conhecimento com o seu time e seguimos evoluindo a solução com você.<\u002Fp>\n          <div class=\"step-line\" data-line=\"1\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section class=\"sec\" id=\"faq\" aria-labelledby=\"t-faq\" style=\"padding-top: 0\">\n    <div class=\"wrap faq-grid\">\n      <div class=\"faq-aside\" data-head=\"1\">\n        <p class=\"overline\">FAQ<\u002Fp>\n        <h2 class=\"h2\" id=\"t-faq\">Perguntas frequentes.<\u002Fh2>\n        <p class=\"lead\">Não encontrou o que procurava? Fale com o nosso time.<\u002Fp>\n        <a class=\"btn btn-secondary\" href=\"#contato\">Enviar uma pergunta<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"faq-list\" data-reveal=\"1\">\n        <details data-r=\"1\">\n          <summary>Para que porte de empresa vocês trabalham?<span class=\"faq-plus\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><path d=\"M7 2v10M2 7h10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary>\n          <p class=\"ans\">Atendemos empresas de diferentes portes. O formato do projeto é ajustado à maturidade digital, ao orçamento e ao momento de cada negócio.<\u002Fp>\n        <\u002Fdetails>\n        <details data-r=\"1\">\n          <summary>Com quais tecnologias a TFE trabalha?<span class=\"faq-plus\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><path d=\"M7 2v10M2 7h10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary>\n          <p class=\"ans\">Nosso foco é o ecossistema Microsoft Power Platform — Power Apps, Power Automate, Power BI e Copilot Studio — integrado a SharePoint e Microsoft 365. Para aplicativos web e mobile, desenvolvemos em Flutter.<\u002Fp>\n        <\u002Fdetails>\n        <details data-r=\"1\">\n          <summary>Quanto tempo leva um projeto?<span class=\"faq-plus\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><path d=\"M7 2v10M2 7h10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary>\n          <p class=\"ans\">Depende do escopo. Após o diagnóstico, apresentamos um cronograma por etapas, com entregas parciais para que você veja resultado desde o início.<\u002Fp>\n        <\u002Fdetails>\n        <details data-r=\"1\">\n          <summary>Vocês integram com os sistemas que já usamos?<span class=\"faq-plus\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><path d=\"M7 2v10M2 7h10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary>\n          <p class=\"ans\">Sim. Partimos do que a empresa já tem — Microsoft 365, SharePoint, planilhas, ERP e CRM — e conectamos as soluções a esse ecossistema, sem recomeçar do zero.<\u002Fp>\n        <\u002Fdetails>\n        <details data-r=\"1\">\n          <summary>Como funciona a segurança dos dados?<span class=\"faq-plus\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><path d=\"M7 2v10M2 7h10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary>\n          <p class=\"ans\">Seguimos boas práticas de segurança e privacidade em todas as etapas, com controle de acesso, rastreabilidade e alinhamento às políticas internas da sua empresa.<\u002Fp>\n        <\u002Fdetails>\n        <details data-r=\"1\">\n          <summary>Preciso ter um time técnico interno?<span class=\"faq-plus\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><path d=\"M7 2v10M2 7h10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary>\n          <p class=\"ans\">Não. Conduzimos o projeto de ponta a ponta e compartilhamos o conhecimento com as pessoas que vão operar a solução — compartilhar faz parte dos nossos valores.<\u002Fp>\n        <\u002Fdetails>\n        <details data-r=\"1\">\n          <summary>O que acontece depois que envio o formulário?<span class=\"faq-plus\" aria-hidden=\"true\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><path d=\"M7 2v10M2 7h10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary>\n          <p class=\"ans\">Um especialista entra em contato para agendar uma conversa inicial, entender o seu cenário e indicar os próximos passos.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT / LEAD -->\n  <section class=\"sec\" id=\"contato\" aria-labelledby=\"t-contato\" style=\"padding-top: 0\">\n    <div class=\"wrap\">\n      <div class=\"contact-card\" data-reveal=\"1\">\n        <div class=\"contact-copy\" data-r=\"1\">\n          <p class=\"overline\">Contato / 004<\u002Fp>\n          <h2 class=\"h2\" id=\"t-contato\">Vamos construir o próximo passo da sua empresa.<\u002Fh2>\n          <p class=\"lead\">Conte um pouco sobre o seu desafio. Um especialista vai preparar a conversa com base no seu cenário.<\u002Fp>\n          <ul class=\"checks\">\n            <li><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 10.5l4 4 10-10\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Conversa inicial sem compromisso<\u002Fli>\n            <li><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 10.5l4 4 10-10\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Mapa de oportunidades para o seu negócio<\u002Fli>\n            <li><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 10.5l4 4 10-10\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Proposta com etapas e entregas claras<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div data-r=\"1\">\n          <sc-if value=\"{{notSent}}\" hint-placeholder-val=\"{{true}}\">\n            <form class=\"form\" sc-camel-on-submit=\"{{submit}}\">\n              <div class=\"field\">\n                <label for=\"f-nome\">Nome<\u002Flabel>\n                <input id=\"f-nome\" name=\"nome\" type=\"text\" autocomplete=\"name\" placeholder=\"Seu nome\" required=\"required\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label for=\"f-email\">E-mail corporativo<\u002Flabel>\n                <input id=\"f-email\" name=\"email\" type=\"email\" autocomplete=\"email\" placeholder=\"voce@empresa.com.br\" required=\"required\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label for=\"f-empresa\">Empresa<\u002Flabel>\n                <input id=\"f-empresa\" name=\"empresa\" type=\"text\" autocomplete=\"organization\" placeholder=\"Nome da empresa\" required=\"required\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label for=\"f-tel\">Telefone / WhatsApp<\u002Flabel>\n                <input id=\"f-tel\" name=\"telefone\" type=\"tel\" autocomplete=\"tel\" placeholder=\"(11) 90000-0000\">\n              <\u002Fdiv>\n              <div class=\"field full\">\n                <label for=\"f-porte\">Tamanho da empresa<\u002Flabel>\n                <sc-raw-select id=\"f-porte\" name=\"porte\" required=\"required\">\n                  <option value=\"\">Selecione<\u002Foption>\n                  <option value=\"1-49\">Até 49 colaboradores<\u002Foption>\n                  <option value=\"50-249\">50 a 249 colaboradores<\u002Foption>\n                  <option value=\"250-999\">250 a 999 colaboradores<\u002Foption>\n                  <option value=\"1000+\">1.000 ou mais<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div class=\"field full\">\n                <label for=\"f-msg\">Qual é o seu principal desafio? (opcional)<\u002Flabel>\n                <textarea id=\"f-msg\" name=\"mensagem\" placeholder=\"Ex.: automatizar aprovações, criar um agente de atendimento…\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div class=\"consent full\"><input id=\"f-consent\" type=\"checkbox\" name=\"consentimento\" required=\"required\"><span><label for=\"f-consent\">Concordo em ser contatado e com a <\u002Flabel><button class=\"link-btn\" type=\"button\" sc-camel-on-click=\"{{openPrivacy}}\">política de privacidade<\u002Fbutton>.<\u002Fspan><\u002Fdiv>\n              <button class=\"btn btn-primary btn-lg btn-block full\" type=\"submit\">Quero falar com um especialista\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M4.5 11.5l7-7M6 4.5h5.5V10\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <p class=\"form-foot full\">Ao enviar, abrimos o WhatsApp com as suas respostas para você falar direto com o nosso time.<\u002Fp>\n            <\u002Fform>\n          <\u002Fsc-if>\n          <sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{false}}\">\n            <div class=\"sent\" role=\"status\">\n              <div class=\"sent-ic\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 10.5l4 4 10-10\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <h3>Continue a conversa no WhatsApp.<\u002Fh3>\n              <p class=\"lead\">Abrimos o WhatsApp com os seus dados preenchidos — é só enviar a mensagem. Se a janela não abriu, use o link abaixo.<\u002Fp>\n              <a class=\"btn btn-primary\" href=\"https://wa.me/5511990078913\" target=\"_blank\" rel=\"noopener\">Abrir WhatsApp · (11) 99007-8913<\u002Fa>\n              <button class=\"btn btn-secondary\" type=\"button\" sc-camel-on-click=\"{{reset}}\">Enviar outro contato<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer class=\"foot\">\n    <div class=\"wrap\">\n      <div class=\"foot-top\">\n        <div>\n          <a class=\"brand\" href=\"#topo\" aria-label=\"TFE — Tech For Everyone, voltar ao topo\"><img class=\"brand-logo brand-logo-lg\" src=\"369caa42-a745-4181-aad4-edd69b2b8f75\" alt=\"TFE\" width=\"1128\" height=\"350\"><\u002Fa>\n          <p class=\"foot-tag\">Tech For Everyone. Simplificar o presente, abrindo espaço para o futuro.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"foot-cols\">\n          <div class=\"foot-col\"><p class=\"overline\">Navegação<\u002Fp><ul><li><a class=\"ul\" href=\"#solucoes\">Especializações<\u002Fa><\u002Fli><li><a class=\"ul\" href=\"#quem-somos\">Quem somos<\u002Fa><\u002Fli><li><a class=\"ul\" href=\"#como-funciona\">Como funciona<\u002Fa><\u002Fli><li><a class=\"ul\" href=\"#parceiros\">Parceiros<\u002Fa><\u002Fli><li><a class=\"ul\" href=\"#faq\">FAQ<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n          <div class=\"foot-col\"><p class=\"overline\">Contato<\u002Fp><ul><li><a class=\"ul\" href=\"#contato\">Falar com um especialista<\u002Fa><\u002Fli><li><a class=\"ul\" href=\"mailto:bruno@TechForEveryone.onmicrosoft.com\">bruno@TechForEveryone.onmicrosoft.com<\u002Fa><\u002Fli><li><a class=\"ul\" href=\"mailto:joao@TechForEveryone.onmicrosoft.com\">joao@TechForEveryone.onmicrosoft.com<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"foot-bot\"><span>© 2026 TFE. Todos os direitos reservados.<\u002Fspan><button class=\"link-btn\" type=\"button\" sc-camel-on-click=\"{{openPrivacy}}\">Política de privacidade<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{privacyOpen}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"pp-overlay\" sc-camel-on-click=\"{{closePrivacy}}\">\n      <div class=\"pp\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"pp-title\" sc-camel-on-click=\"{{stopClick}}\">\n        <div class=\"pp-top\">\n          <div>\n            <p class=\"overline\">LGPD · Lei 13.709/2018<\u002Fp>\n            <h2 id=\"pp-title\">Política de privacidade<\u002Fh2>\n            <p class=\"meta\">Última atualização: 16 de outubro de 2026<\u002Fp>\n          <\u002Fdiv>\n          <button class=\"pp-close\" type=\"button\" aria-label=\"Fechar política de privacidade\" sc-camel-on-click=\"{{closePrivacy}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3.5 3.5l9 9M12.5 3.5l-9 9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n\n        <h3>1. Quem somos<\u002Fh3>\n        <p>Esta política explica como a TFE — Tech For Everyone, [Razão social], inscrita no CNPJ [00.000.000/0000-00] (“TFE”, “nós”), trata os dados pessoais coletados neste site, em conformidade com a Lei Geral de Proteção de Dados (Lei 13.709/2018 — LGPD).<\u002Fp>\n        <p>Encarregado pelo tratamento de dados (DPO): [Nome do encarregado] — [e-mail do encarregado]. Também é possível falar conosco por bruno@TechForEveryone.onmicrosoft.com ou joao@TechForEveryone.onmicrosoft.com.<\u002Fp>\n\n        <h3>2. Dados que coletamos<\u002Fh3>\n        <ul>\n          <li><strong>Dados que você nos informa no formulário:<\u002Fstrong> nome, e-mail corporativo, empresa, telefone/WhatsApp, tamanho da empresa e, opcionalmente, a descrição do seu desafio.<\u002Fli>\n          <li><strong>Dados técnicos de navegação:<\u002Fstrong> endereço IP e informações do navegador, tratados pelos serviços que carregam recursos do site (como fontes tipográficas).<\u002Fli>\n        <\u002Ful>\n        <p>Não coletamos dados sensíveis e não utilizamos cookies de publicidade ou rastreamento.<\u002Fp>\n\n        <h3>3. Para que usamos os dados<\u002Fh3>\n        <ul>\n          <li>Retornar o seu contato e agendar a conversa inicial;<\u002Fli>\n          <li>Entender o cenário da sua empresa e preparar propostas comerciais;<\u002Fli>\n          <li>Manter o histórico do relacionamento comercial.<\u002Fli>\n        <\u002Ful>\n        <p>Não vendemos nem alugamos dados pessoais.<\u002Fp>\n\n        <h3>4. Bases legais<\u002Fh3>\n        <p>Tratamos seus dados com base no seu <strong>consentimento<\u002Fstrong> (art. 7º, I), manifestado ao marcar a caixa de concordância do formulário, e na execução de <strong>procedimentos preliminares relacionados a contrato<\u002Fstrong> (art. 7º, V), quando a conversa evolui para uma proposta.<\u002Fp>\n\n        <h3>5. Compartilhamento<\u002Fh3>\n        <p>Os dados podem ser tratados pelos seguintes fornecedores, apenas para as finalidades acima:<\u002Fp>\n        <ul>\n          <li><strong>WhatsApp (Meta):<\u002Fstrong> ao enviar o formulário, abrimos uma conversa no WhatsApp com as suas respostas preenchidas;<\u002Fli>\n          <li><strong>Microsoft 365:<\u002Fstrong> comunicação por e-mail e armazenamento de informações comerciais;<\u002Fli>\n          <li><strong>Provedores de hospedagem e Google Fonts:<\u002Fstrong> funcionamento e exibição do site.<\u002Fli>\n        <\u002Ful>\n        <p>Alguns desses fornecedores podem armazenar dados fora do Brasil. Nesses casos, a transferência internacional ocorre conforme o art. 33 da LGPD, com fornecedores que adotam garantias adequadas de proteção.<\u002Fp>\n\n        <h3>6. Por quanto tempo guardamos<\u002Fh3>\n        <p>Mantemos os dados por até [24 meses] após o último contato ou até que você solicite a exclusão, salvo quando a guarda for exigida por obrigação legal.<\u002Fp>\n\n        <h3>7. Seus direitos<\u002Fh3>\n        <p>Nos termos do art. 18 da LGPD, você pode, a qualquer momento:<\u002Fp>\n        <ul>\n          <li>confirmar a existência de tratamento e acessar seus dados;<\u002Fli>\n          <li>corrigir dados incompletos, inexatos ou desatualizados;<\u002Fli>\n          <li>solicitar anonimização, bloqueio ou eliminação de dados;<\u002Fli>\n          <li>solicitar a portabilidade dos dados;<\u002Fli>\n          <li>saber com quem seus dados foram compartilhados;<\u002Fli>\n          <li>revogar o consentimento.<\u002Fli>\n        <\u002Ful>\n        <p>Para exercer seus direitos, escreva para [e-mail do encarregado]. Respondemos em até 15 dias.<\u002Fp>\n\n        <h3>8. Segurança<\u002Fh3>\n        <p>Adotamos medidas técnicas e administrativas para proteger os dados, como acesso restrito às pessoas responsáveis pelo atendimento e contas protegidas por autenticação.<\u002Fp>\n\n        <h3>9. Cookies<\u002Fh3>\n        <p>Este site não utiliza cookies de publicidade nem ferramentas de análise de navegação. Caso isso mude, esta política será atualizada antes da implementação.<\u002Fp>\n\n        <h3>10. Alterações desta política<\u002Fh3>\n        <p>Podemos atualizar esta política periodicamente. A data da versão vigente está sempre indicada no topo deste documento.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div class=\"{{stickyClass}}\" aria-hidden=\"{{stickyHidden}}\">\n    <span>Pronto para começar?<\u002Fspan>\n    <a class=\"btn btn-primary\" href=\"#contato\" tabindex=\"{{stickyTab}}\">Falar com especialista<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:7700}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { menuOpen: false, sent: false, sticky: false };\n    this._cleanup = [];\n  }\n\n  renderVals() {\n    var self = this;\n    return {\n      menuOpen: this.state.menuOpen,\n      menuExpanded: this.state.menuOpen ? 'true' : 'false',\n      toggleMenu: function () { self.setState({ menuOpen: !self.state.menuOpen }); },\n      closeMenu: function () { self.setState({ menuOpen: false }); },\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      submit: function (e) {\n        if (e && e.preventDefault) e.preventDefault();\n        // Send the lead straight to WhatsApp with the form answers pre-filled\n        var form = e && (e.currentTarget || e.target);\n        var get = function (name) { var el = form && form.elements ? form.elements[name] : null; return el && el.value ? String(el.value).trim() : ''; };\n        var porteEl = form && form.elements ? form.elements['porte'] : null;\n        var porte = porteEl && porteEl.selectedIndex > 0 ? porteE
